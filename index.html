<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Ching Cheat</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Outer Layout wrapper */
        .matrix-layout {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--card-bg);
            padding: 10px;
        }

        /* 1. TOP HORIZONTAL SCROLLBAR */
        .top-scroll-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            height: 14px;
            margin-bottom: 8px;
        }
        .top-scroll-spacer {
            height: 1px;
            /* Width gets set dynamically by Javascript */
        }
        .top-scroll-container::-webkit-scrollbar {
            height: 10px;
        }
        .top-scroll-container::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 5px;
        }
        .top-scroll-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 5px;
        }

        /* 2. MAIN HORIZONTAL CONTAINER (Bottom native scrollbar hidden) */
        .horizontal-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .horizontal-container::-webkit-scrollbar {
            display: none; /* Hide Chrome/Safari bottom scrollbar */
        }

        /* 3. LEFT VERTICAL SCROLLBAR */
        .vertical-left-container {
            direction: rtl; /* Forces scrollbar to the left side */
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: hidden;
            width: max-content;
            min-width: 100%;
        }
        .vertical-left-container::-webkit-scrollbar {
            width: 10px;
        }
        .vertical-left-container::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 5px;
        }
        .vertical-left-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 5px;
        }

        /* 4. GRID CONTENT WRAPPER (Restores text direction to normal) */
        .grid-content-wrapper {
            direction: ltr; /* Sets text back to normal left-to-right */
            display: inline-block;
            width: max-content;
            min-width: 100%;
            padding-left: 8px; /* Buffer spacing away from the scrollbar */
        }

        .grid-8x8 {
            display: grid;
            grid-template-columns: 55px repeat(8, 110px);
            grid-template-rows: 55px repeat(8, 110px);
            gap: 6px;
        }
        .header {
            background-color: #1e293b;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            border-radius: 4px;
        }
        .corner {
            background-color: #0b0f19;
            font-size: 0.6rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.2;
        }
        
        /* Forced square boxes */
        .cell {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 110px;
            height: 110px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            position: relative;
        }
        .cell:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background-color: #1a233a;
        }
        
        .symbol {
            font-size: 1.8rem;
            line-height: 1.1;
            margin-top: 4px;
        }
        
        .name {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 1px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        .meaning {
            font-size: 0.55rem;
            color: var(--accent);
            background-color: rgba(56, 189, 248, 0.08);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            padding: 3px 2px;
            border-radius: 3px;
            line-height: 1.1;
            margin-bottom: 2px;
            width: 100%;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <p class="subtitle"></p>

    <!-- Matrix Layout Container -->
    <div class="matrix-layout">
        
        <!-- Top Horizontal Scrollbar -->
        <div class="top-scroll-container" id="topScroll">
            <div class="top-scroll-spacer" id="spacer"></div>
        </div>

        <!-- Hidden Bottom Scrollbar Container -->
        <div class="horizontal-container" id="mainScroll">
            
            <!-- Left Vertical Scrollbar Container -->
            <div class="vertical-left-container">
                
                <!-- Inner Layout (Restores Normal Reading Direction) -->
                <div class="grid-content-wrapper" id="contentWrapper">
                    <div class="grid-8x8" id="gridContainer"></div>
                </div>

            </div>

        </div>
    </div>

    <script>
        const trigrams = ['☰', '☱', '☲', '☳', '☴', '☵', '☶', '☷'];

        const matrixData = [
            [
                {n: "Qian", m: "The Creative, Heaven", sym: "䷀"},
                {n: "Guai", m: "Breakthrough", sym: "䷪"},
                {n: "Da You", m: "Great Possession", sym: "䷍"},
                {n: "Da Zhuang", m: "Great Power", sym: "䷡"},
                {n: "Xiao Chu", m: "Small Taming", sym: "䷈"},
                {n: "Xu", m: "Waiting, Patience", sym: "䷄"},
                {n: "Da Chu", m: "Great Taming", sym: "䷙"},
                {n: "Tai", m: "Peace, Flow", sym: "䷊"}
            ],
            [
                {n: "Lu", m: "Treading, Conduct", sym: "䷉"},
                {n: "Dui", m: "The Joyous, Lake", sym: "䷹"},
                {n: "Kui", m: "Opposition", sym: "䷥"},
                {n: "Gui Mei", m: "Marrying Maiden", sym: "䷵"},
                {n: "Zhong Fu", m: "Inner Truth", sym: "䷼"},
                {n: "Jie", m: "Limitation", sym: "䷻"},
                {n: "Sun", m: "Decrease", sym: "䷨"},
                {n: "Lin", m: "Approach", sym: "䷒"}
            ],
            [
                {n: "Tong Ren", m: "Fellowship", sym: "䷌"},
                {n: "Ge", m: "Revolution", sym: "䷰"},
                {n: "Li", m: "The Clinging, Fire", sym: "䷝"},
                {n: "Feng", m: "Abundance", sym: "䷶"},
                {n: "Jia Ren", m: "The Family", sym: "䷤"},
                {n: "Ji Ji", m: "After Completion", sym: "䷾"},
                {n: "Bi", m: "Grace, Adornment", sym: "䷕"},
                {n: "Ming Yi", m: "Darkening of Light", sym: "䷣"}
            ],
            [
                {n: "Wu Wang", m: "Innocence", sym: "䷘"},
                {n: "Sui", m: "Following", sym: "䷐"},
                {n: "Shi He", m: "Biting Through", sym: "䷔"},
                {n: "Zhen", m: "The Arousing", sym: "䷲"},
                {n: "Yi", m: "Increase, Expansion", sym: "䷩"},
                {n: "Zhun", m: "Initial Difficulty", sym: "䷂"},
                {n: "Yi", m: "Nourishment", sym: "䷚"},
                {n: "Fu", m: "Return, Turning Point", sym: "䷗"}
            ],
            [
                {n: "Gou", m: "Coming to Meet", sym: "䷫"},
                {n: "Da Guo", m: "Great Preponderance", sym: "䷛"},
                {n: "Ding", m: "The Cauldron", sym: "䷱"},
                {n: "Heng", m: "Duration", sym: "䷟"},
                {n: "Xun", m: "The Gentle, Wind", sym: "䷸"},
                {n: "Jing", m: "The Well, Source", sym: "䷯"},
                {n: "Gu", m: "Work on Decayed", sym: "䷑"},
                {n: "Sheng", m: "Pushing Upward", sym: "䷭"}
            ],
            [
                {n: "Song", m: "Conflict, Dispute", sym: "䷅"},
                {n: "Kun", m: "Oppression", sym: "䷮"},
                {n: "Wei Ji", m: "Before Completion", sym: "䷿"},
                {n: "Xie", m: "Deliverance, Relief", sym: "䷧"},
                {n: "Huan", m: "Dispersion", sym: "䷺"},
                {n: "Kan", m: "The Abysmal, Water", sym: "䷜"},
                {n: "Meng", m: "Youthful Folly", sym: "䷃"},
                {n: "Shi", m: "The Army", sym: "䷆"}
            ],
            [
                {n: "Dun", m: "Retreat", sym: "䷠"},
                {n: "Xian", m: "Influence", sym: "䷞"},
                {n: "Lu", m: "The Wanderer", sym: "䷷"},
                {n: "Xiao Guo", m: "Small Preponderance", sym: "䷽"},
                {n: "Jian", m: "Development", sym: "䷴"},
                {n: "Jian", m: "Obstruction", sym: "䷦"},
                {n: "Gen", m: "Keeping Still", sym: "䷳"},
                {n: "Qian", m: "Modesty, Balance", sym: "䷎"}
            ],
            [
                {n: "Pi", m: "Standstill", sym: "䷋"},
                {n: "Cui", m: "Gathering Together", sym: "䷬"},
                {n: "Jin", m: "Progress, Advance", sym: "䷢"},
                {n: "Yu", m: "Enthusiasm, Joy", sym: "䷏"},
                {n: "Guan", m: "Contemplation", sym: "䷓"},
                {n: "Bi", m: "Union, Alliance", sym: "䷇"},
                {n: "Bo", m: "Splitting Apart", sym: "䷖"},
                {n: "Kun", m: "The Receptive, Earth", sym: "䷁"}
            ]
        ];

        const container = document.getElementById('gridContainer');

        const corner = document.createElement('div');
        corner.className = 'header corner';
        corner.innerHTML = "UPPER&rarr;<br>LOWER&darr;";
        container.appendChild(corner);

        trigrams.forEach(trig => {
            const th = document.createElement('div');
            th.className = 'header';
            th.textContent = trig;
            container.appendChild(th);
        });

        matrixData.forEach((row, r) => {
            const lh = document.createElement('div');
            lh.className = 'header';
            lh.textContent = trigrams[r];
            container.appendChild(lh);

            row.forEach(item => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerHTML = `
                    <div class="symbol">${item.sym}</div>
                    <div class="name">${item.n}</div>
                    <div class="meaning">${item.m}</div>
                `;
                container.appendChild(cell);
            });
        });

        // SCROLLBAR SYNCHRONIZATION LOGIC 
        const topScroll = document.getElementById('topScroll');
        const mainScroll = document.getElementById('mainScroll');
        const contentWrapper = document.getElementById('contentWrapper');
        const spacer = document.getElementById('spacer');

        // Dynamically matches the top dummy scrollbar size to the real grid size
        function updateSpacerWidth() {
            spacer.style.width = contentWrapper.scrollWidth + 'px';
        }
        
        // Initial setup and listener for screen resize
        updateSpacerWidth();
        window.addEventListener('resize', updateSpacerWidth);

        // Locks prevent infinite scrolling loops when dragging scrollbars
        let syncLockTop = false;
        let syncLockMain = false;

        topScroll.addEventListener('scroll', () => {
            if (syncLockTop) {
                syncLockTop = false;
                return;
            }
            syncLockMain = true;
            mainScroll.scrollLeft = topScroll.scrollLeft;
        });

        mainScroll.addEventListener('scroll', () => {
            if (syncLockMain) {
                syncLockMain = false;
                return;
            }
            syncLockTop = true;
            topScroll.scrollLeft = mainScroll.scrollLeft;
        });
    </script>
</body>
</html>
